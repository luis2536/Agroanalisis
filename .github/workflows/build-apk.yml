name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --update
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Prepare Capacitor Android
        shell: bash
        run: |
          set -e

          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "No se encontró la configuración de Capacitor."
            exit 1
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          if [ ! -f "android/gradlew" ]; then
            echo "No se encontró android/gradlew después de sincronizar Capacitor."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify generated APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "No se generó el APK esperado: $APK"
            find android -type f -name "*.apk" -print
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agroanalisis-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error