name: Compilacion APK Android Capacitor

on:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias web
        run: npm install

      - name: Construir la app web
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./android/gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug
        working-directory: ./android

      - name: Subir la APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Agroanalisis-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
